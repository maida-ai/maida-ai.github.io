[project]
name = "maida-web"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1",
    "frozen-flask>=1.0",
    "myst-parser>=5.1",
    "pydata-sphinx-theme>=0.20",
    "sphinx>=9.1",
    "sphinx-copybutton>=0.5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
