<section
  id="product"
  class="home-chapter hero-chapter"
  data-nav-section="product"
  aria-labelledby="hero-title"
>
  <div class="chapter-shell hero-chapter__inner">
    <header class="hero-copy reveal" data-reveal>
      <p class="chapter-index"><span>01</span> Product</p>
      <h1 id="hero-title">
        Agents change when code changes.
        <span>Catch it before merge.</span>
      </h1>
      <p class="hero-copy__lede">
        Maida compares agent execution traces against a checked-in baseline
        and blocks the PR when structural behavior regresses.
      </p>
      <div class="hero-actions">
        <a class="button button--primary" href="/docs/getting-started/">
          Run the 60-second demo
          <span aria-hidden="true">-></span>
        </a>
        <a class="text-link" href="https://github.com/maida-ai/maida">
          View on GitHub <span aria-hidden="true">-></span>
        </a>
      </div>
    </header>

    <figure class="hero-trajectory reveal" data-reveal>
      <svg
        class="trajectory-graphic trajectory-graphic--hero"
        viewBox="0 0 1120 450"
        role="img"
        aria-labelledby="hero-trace-title hero-trace-description"
      >
        <title id="hero-trace-title">Baseline and pull request execution trajectories</title>
        <desc id="hero-trace-description">
          A known-good execution and a pull request execution begin at the same
          input and agent, then diverge. The pull request repeats search and
          introduces a new CRM tool before returning the same answer.
        </desc>

        <text x="30" y="113" class="trace-kicker">KNOWN GOOD</text>
        <text x="30" y="349" class="trace-kicker trace-kicker--changed">PR CHANGE</text>

        <path class="trace-track" d="M78 224H267" />
        <path class="trace-track" d="M267 224C355 224 356 121 451 121H1025" />
        <path class="trace-track" d="M267 224C355 224 356 330 451 330H1025" />

        <path class="trace-draw trace-draw--shared" d="M78 224H267" />
        <path class="trace-draw trace-draw--pass" d="M267 224C355 224 356 121 451 121H1025" />
        <path class="trace-draw trace-draw--fail" d="M267 224C355 224 356 330 451 330H1025" />

        <g class="trace-node trace-node--input">
          <circle cx="78" cy="224" r="9" />
          <text x="78" y="257" text-anchor="middle">input</text>
        </g>
        <g class="trace-node trace-node--agent">
          <circle cx="267" cy="224" r="22" />
          <text x="267" y="229" text-anchor="middle" class="trace-node__initial">A</text>
          <text x="267" y="267" text-anchor="middle">agent</text>
        </g>

        <g class="trace-node trace-node--pass">
          <circle cx="505" cy="121" r="9" />
          <text x="505" y="91" text-anchor="middle">search</text>
        </g>
        <g class="trace-node trace-node--pass">
          <circle cx="704" cy="121" r="9" />
          <text x="704" y="91" text-anchor="middle">lookup</text>
        </g>
        <g class="trace-node trace-node--pass">
          <circle cx="1025" cy="121" r="13" />
          <text x="1025" y="91" text-anchor="middle">answer</text>
        </g>

        <g class="trace-node trace-node--fail">
          <circle cx="485" cy="330" r="9" />
          <text x="485" y="365" text-anchor="middle">search</text>
        </g>
        <g class="trace-node trace-node--fail">
          <circle cx="616" cy="330" r="9" />
          <text x="616" y="365" text-anchor="middle">search</text>
        </g>
        <g class="trace-node trace-node--fail">
          <circle cx="747" cy="330" r="9" />
          <text x="747" y="365" text-anchor="middle">search</text>
        </g>
        <g class="trace-node trace-node--new">
          <circle cx="865" cy="330" r="17" />
          <text x="865" y="301" text-anchor="middle" class="trace-alert">NEW</text>
          <text x="865" y="369" text-anchor="middle">CRM</text>
        </g>
        <g class="trace-node trace-node--fail">
          <circle cx="1025" cy="330" r="13" />
          <text x="1025" y="365" text-anchor="middle">same answer</text>
        </g>
      </svg>

      <div
        class="trajectory-mobile"
        role="img"
        aria-label="The main branch searches and looks up once. The pull request searches three times and adds a new CRM call before producing the same answer."
      >
        <div class="trajectory-mobile__row trajectory-mobile__row--pass">
          <span class="trajectory-mobile__label">Main</span>
          <span>input</span><i></i><span>agent</span><i></i><span>lookup</span><i></i><span>answer</span>
        </div>
        <div class="trajectory-mobile__row trajectory-mobile__row--fail">
          <span class="trajectory-mobile__label">PR</span>
          <span>input</span><i></i><span>agent</span><i></i><span>search x3</span><i></i><span class="is-new">CRM <b>new</b></span><i></i><span>answer</span>
        </div>
      </div>

      <figcaption>
        <span class="status-key status-key--pass">Baseline</span>
        <span class="status-key status-key--fail">Changed in PR</span>
        <span class="hero-trajectory__note">Same input. Same answer. Different behavior.</span>
      </figcaption>
    </figure>
  </div>
</section>
