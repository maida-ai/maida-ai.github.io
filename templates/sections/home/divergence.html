        <desc id="comparison-description">

        </desc>

        <text x="88" y="67" class="comparison-branch">MAIN</text>

        <path class="trace-track" d="M265 124V528" />

        <g class="comparison-node comparison-node--pass">
          <circle cx="265" cy="124" r="8" /><text x="291" y="130">user request</text>
          <circle cx="265" cy="252" r="13" /><text x="291" y="258">agent</text>
          <circle cx="265" cy="380" r="8" /><text x="291" y="386">lookup_order</text>
          <circle cx="265" cy="528" r="12" /><text x="291" y="534">answer</text>

        <path class="trace-track" d="M793 124V557" />
        <path class="trace-draw trace-draw--fail" d="M793 124V557" />

          <circle cx="793" cy="124" r="8" /><text x="819" y="130">user request</text>

          <circle cx="793" cy="286" r="8" /><text x="819" y="292">lookup_order</text>

          <circle cx="793" cy="484" r="15" class="comparison-node__new" />
          <text x="819" y="490">crm_update</text>
          <text x="767" y="489" text-anchor="end" class="trace-alert">NEW</text>
          <circle cx="793" cy="557" r="12" /><text x="819" y="563">answer</text>
        </g>

        <text x="88" y="619" class="comparison-result">ORDER #4821 · SHIPPED</text>
        <text x="617" y="619" class="comparison-result">ORDER #4821 · SHIPPED</text>
