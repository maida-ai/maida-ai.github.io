<!doctype html>
<html lang="en" class="scroll-smooth no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="canonical" href="{{ SITE_URL }}{{ request.path }}" />

    <!-- Primary Meta -->
    <title>{% block title %}Maida -- Pre-merge behavioral regression gate for AI agents{% endblock %}</title>
    <meta name="description" content="{% block description %}Your agent still returns the right answer -- but now it calls 3x the tools. Maida is the pre-merge behavioral regression gate for AI agents. Local-first, no cloud.{% endblock %}" />
    <meta name="theme-color" content="{% block theme_color %}#0f1110{% endblock %}" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Maida" />
    <meta property="og:url" content="{{ SITE_URL }}{{ request.path }}" />
    <meta property="og:title" content="{% block og_title %}Don't let broken agent changes merge{% endblock %}" />
    <meta property="og:description" content="{% block og_description %}Your agent still returns the right answer -- but now it calls 3x the tools. Maida compares agent traces against a checked-in baseline and blocks the PR.{% endblock %}" />
    <!-- Absolute URL: relative og:image paths are not resolved by every scraper. -->
    <meta property="og:image" content="{% block og_image %}{{ SITE_URL }}/static/og.png{% endblock %}" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="{% block og_image_alt %}A baseline agent run and a pull request run side by side. The pull request repeats a search three times and adds a new CRM tool call, and the Maida gate fails.{% endblock %}" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{% block tw_title %}Don't let broken agent changes merge{% endblock %}" />
    <meta name="twitter:description" content="{% block tw_description %}Your agent still returns the right answer -- but now it calls 3x the tools. Maida compares agent traces against a checked-in baseline and blocks the PR.{% endblock %}" />
    <meta name="twitter:image" content="{% block tw_image %}{{ SITE_URL }}/static/og.png{% endblock %}" />
    <meta name="twitter:image:alt" content="{% block tw_image_alt %}A baseline agent run and a pull request run side by side. The pull request repeats a search three times and adds a new CRM tool call, and the Maida gate fails.{% endblock %}" />

    <script>document.documentElement.classList.replace('no-js', 'js');</script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="bg-bg text-text-primary font-sans antialiased {% block body_class %}{% endblock %}">
    {% block content %}{% endblock %}

    <script src="/static/site.js" defer></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
